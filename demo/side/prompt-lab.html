<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Prompt Lab</title>
    <style>
      :root {
        color: #202327;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f6f8;
      }

      body {
        padding: 20px;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(560px, 1.2fr) minmax(420px, 0.8fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        border: 1px solid #dde3ea;
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid #edf1f5;
        background: #fbfcfd;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 15px;
      }

      .panel-body {
        padding: 16px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field > label {
        font-size: 13px;
        color: #4b5563;
        font-weight: 600;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid #cfd7e3;
        border-radius: 8px;
        background: #fff;
        color: #202327;
        font: inherit;
      }

      input,
      select {
        height: 38px;
        padding: 0 12px;
      }

      textarea {
        min-height: 120px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.55;
      }

      textarea.compact {
        min-height: 88px;
      }

      textarea.large {
        min-height: 260px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        height: 38px;
        padding: 0 14px;
        border: 1px solid #cfd7e3;
        border-radius: 8px;
        background: #fff;
        color: #202327;
        font: inherit;
        cursor: pointer;
      }

      button.primary {
        border-color: #171a1f;
        background: #171a1f;
        color: #fff;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .meta .field {
        min-width: 0;
      }

      .hint {
        color: #6b7280;
        font-size: 12px;
        line-height: 1.5;
      }

      .result {
        min-height: 320px;
        padding: 14px;
        border-radius: 8px;
        background: #0f1720;
        color: #d8e3ef;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .status {
        font-size: 12px;
        color: #6b7280;
      }

      .danger {
        color: #b42318;
      }

      @media (max-width: 1180px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel">
        <div class="panel-header">
          <h2>Prompt 调试</h2>
          <div class="status" id="requestStatus">未发送</div>
        </div>
        <div class="panel-body">
          <div class="stack">
            <div class="meta">
              <div class="field">
                <label for="promptMode">调试模式</label>
                <select id="promptMode">
                  <option value="dom-plan">DOM Plan</option>
                  <option value="freeform">自由提示词</option>
                </select>
              </div>
              <div class="field">
                <label for="apiKey">DeepSeek API Key</label>
                <input id="apiKey" type="password" placeholder="sk-..." />
              </div>
              <div class="field">
                <label for="model">模型</label>
                <select id="model">
                  <option value="deepseek-chat">deepseek-chat</option>
                  <option value="deepseek-reasoner">deepseek-reasoner</option>
                  <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                  <option value="deepseek-v4-pro">deepseek-v4-pro</option>
                </select>
              </div>
              <div class="field">
                <label for="temperature">temperature</label>
                <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.2" />
              </div>
            </div>

            <div class="field">
              <label for="systemPrompt">系统提示词</label>
              <textarea id="systemPrompt" class="large"></textarea>
            </div>

            <div class="field">
              <label for="selectionText">选区文本</label>
              <textarea
                id="selectionText"
                class="large"
                placeholder="把原始选区直接贴这里，和提示词分开调试。"
              ></textarea>
            </div>

            <div class="field">
              <label for="requirementText">用户提示词</label>
              <textarea
                id="requirementText"
                class="compact"
                placeholder="输入你希望模型完成的任务，例如：把这个 DOM 简化成适合源码检索的关键词"
              ></textarea>
            </div>

            <div class="field">
              <label for="extraContext">额外上下文</label>
              <textarea
                id="extraContext"
                class="compact"
                placeholder="可选：项目名、页面路径、技术栈、你想补充给模型的限制。"
              ></textarea>
            </div>

            <div class="toolbar">
              <button id="copyPromptBtn">复制用户消息</button>
              <button id="sendBtn" class="primary">发送到 DeepSeek</button>
              <button id="planPresetBtn">使用 DOM Plan 提示词</button>
              <button id="resetBtn">恢复默认提示词</button>
            </div>

            <div class="field">
              <label for="userPrompt">最终用户消息</label>
              <textarea id="userPrompt" class="large" readonly></textarea>
              <div class="hint">
                这里是最终发给模型的 user message，会随着选区文本、用户提示词和额外上下文自动更新。
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>模型输出</h2>
          <div class="status" id="responseMeta">等待请求</div>
        </div>
        <div class="panel-body">
          <div class="stack">
            <div class="toolbar">
              <button id="copyResultBtn">复制结果</button>
              <button id="clearResultBtn">清空结果</button>
            </div>
            <div class="hint">
              DOM Plan 模式会让模型只输出下一步本地检索计划，方便单独检查 Planner 是否跑偏。
            </div>
            <pre class="result" id="resultBox"></pre>
          </div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = 'magnus-prompt-lab:v3';
      const TECH_STACK_PROMPT = [
        '## 技术栈',
        '- Vue',
        '- Vite',
        '- TypeScript',
        '- Sass',
        '- Vue Router',
        '- Vuex',
        '- Axios',
        '- Naive UI'
      ].join('\n');
      const DOM_PLAN_SYSTEM_PROMPT = [
        TECH_STACK_PROMPT,
        '',
        '你是 Magnus 的 DOM 检索线索分析器。',
        '',
        '输入包含：用户需求、动态技术栈、页面上下文、当前 DOM、已有真实源码证据。',
        '',
        '你的任务：',
        '',
        '理解用户关注的 DOM 目标。',
        '从 DOM 中选择可能能在源码中检索到的稳定线索。',
        '排除不适合作为源码检索词的内容。',
        '当前没有可用检索线索时，申请扩区。',
        '',
        '规则：',
        '',
        '- DOM 是运行时结果，不等于源码。',
        '- 不把推测当作事实。',
        '- 不编造文件、组件、变量、字段、关键词或路径。',
        '- 检索词只能来自当前 DOM、页面上下文或已有真实源码证据。',
        '- 结合动态技术栈判断哪些内容可能是框架或 UI 组件运行时产物。',
        '- 框架 class、组件库 class、运行时 style、CSS 变量、动态 hash class、SVG path 不得加入检索计划。',
        '- 对 DOM 文案必须判断：',
        '  - source-copy：固定界面文案，可能存在于源码，可参与检索。',
        '  - runtime-data：用户名、金额、日期、商品名、列表数据、当前选中值、用户输入、接口状态等，通常来自运行时数据，不得作为检索词。',
        '  - unknown：无法判断来源，不得作为首轮独立检索词。',
        '- data-*、id、name、href、稳定属性值、固定界面文案、业务 class、页面路径可以作为检索线索。',
        '- 只要存在一个合理检索线索，就返回 ready；无法最终确认源码不等于必须扩区。',
        '- 只有没有任何合理检索线索，或本地检索后无法继续时，才返回 need-more-context。',
        '- 最多输出 2 个检索计划。',
        '',
        '额外限制：',
        '',
        '- runtime-data、框架 class、组件库 class、style、CSS 变量、SVG path 不得出现在 searches.keywords。',
        '- need-more-context 时只能输出 expand-dom。',
        '- ready 时至少有一个非空 searches.keywords。',
        '- resolved 时 nextPlan 必须为空。',
        '',
        '严格输出 JSON，不输出 Markdown，不输出解释文字。',
        '',
        '输出结构：',
        JSON.stringify({
          status: 'ready | need-more-context | resolved | insufficient',
          understanding: {
            userTarget: '',
            selectedDomAnchors: [],
            ignoredDomAnchors: []
          },
          evidenceAssessment: {
            sufficient: false,
            missingEvidence: []
          },
          hypotheses: [{
            id: '',
            description: '',
            confidence: 0,
            basedOn: []
          }],
          nextPlan: [{
            id: '',
            capability: 'expand-dom | resolve-route | locate-structure | trace-rendering | trace-style | trace-event | trace-data | inspect-candidates | trace-imports | validate-relation',
            searches: [{
              keywords: [],
              mode: 'all | any',
              range: 'same-file | same-structure',
              reason: ''
            }],
            relation: 'same-scope | same-rendering-context | same-style-context | same-event-context | same-data-context | same-object | same-template-block | import-relation | parent-child-context',
            scopeHint: 'current-selection | runtime-chain-first | route-entry-first | candidate-files-first | direct-dependencies-first | shared-components-first',
            purpose: ''
          }],
          stopReason: ''
        }, null, 2)
      ].join('\n');

      const els = {
        apiKey: document.getElementById('apiKey'),
        promptMode: document.getElementById('promptMode'),
        model: document.getElementById('model'),
        temperature: document.getElementById('temperature'),
        systemPrompt: document.getElementById('systemPrompt'),
        selectionText: document.getElementById('selectionText'),
        requirementText: document.getElementById('requirementText'),
        extraContext: document.getElementById('extraContext'),
        userPrompt: document.getElementById('userPrompt'),
        resultBox: document.getElementById('resultBox'),
        requestStatus: document.getElementById('requestStatus'),
        responseMeta: document.getElementById('responseMeta'),
        copyPromptBtn: document.getElementById('copyPromptBtn'),
        sendBtn: document.getElementById('sendBtn'),
        planPresetBtn: document.getElementById('planPresetBtn'),
        resetBtn: document.getElementById('resetBtn'),
        copyResultBtn: document.getElementById('copyResultBtn'),
        clearResultBtn: document.getElementById('clearResultBtn')
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function saveState() {
        const data = {
          apiKey: els.apiKey.value,
          promptMode: els.promptMode.value,
          model: els.model.value,
          temperature: els.temperature.value,
          systemPrompt: els.systemPrompt.value,
          selectionText: els.selectionText.value,
          requirementText: els.requirementText.value,
          extraContext: els.extraContext.value,
          userPrompt: els.userPrompt.value
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function buildUserPrompt() {
        if (els.promptMode.value === 'dom-plan') {
          const pageContext = els.extraContext.value.trim() || '未提供';
          const requirement = els.requirementText.value.trim() || '找到源码';
          const dom = els.selectionText.value.trim() || '-';
          return [
            '当前输入：',
            JSON.stringify({
              requirement,
              pageContext,
              currentDomSelection: dom,
              executionHistory: [],
              sourceEvidence: []
            }, null, 2)
          ].join('\n');
        }
        const lines = [
          '用户提示词：',
          els.requirementText.value.trim() || '-',
          '',
          '选区原始文本：',
          els.selectionText.value.trim() || '-'
        ];

        const extra = els.extraContext.value.trim();
        if (extra) {
          lines.push('', '额外上下文：', extra);
        }

        return lines.join('\n');
      }

      function updateUserPrompt() {
        els.userPrompt.value = buildUserPrompt();
      }

      function setDefaultPrompt() {
        if (els.promptMode.value === 'dom-plan') {
          els.systemPrompt.value = DOM_PLAN_SYSTEM_PROMPT;
          if (!els.requirementText.value.trim()) {
            els.requirementText.value = '根据当前 DOM 输出下一步本地源码检索 Plan';
          }
          return;
        }
        els.systemPrompt.value = TECH_STACK_PROMPT;
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          els.requestStatus.textContent = '已复制';
        } catch (error) {
          els.requestStatus.textContent = '复制失败';
          els.requestStatus.classList.add('danger');
        }
      }

      function setBusy(busy) {
        els.sendBtn.disabled = busy;
      }

      async function sendRequest() {
        const apiKey = els.apiKey.value.trim();
        const systemPrompt = els.systemPrompt.value.trim();
        const userPrompt = els.userPrompt.value.trim();
        const model = els.model.value;
        const temperature = Number(els.temperature.value || '0.2');

        if (!apiKey) {
          els.requestStatus.textContent = '缺少 API Key';
          els.requestStatus.classList.add('danger');
          return;
        }
        if (!systemPrompt || !userPrompt) {
          els.requestStatus.textContent = '提示词为空';
          els.requestStatus.classList.add('danger');
          return;
        }

        els.requestStatus.classList.remove('danger');
        els.responseMeta.classList.remove('danger');
        els.requestStatus.textContent = '请求中...';
        els.responseMeta.textContent = '等待响应';
        els.resultBox.textContent = '';
        setBusy(true);
        saveState();

        const startedAt = Date.now();
        try {
          const response = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model,
              temperature,
              stream: false,
              messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt }
              ]
            })
          });

          const elapsed = Date.now() - startedAt;
          const text = await response.text();
          let json = null;
          try {
            json = JSON.parse(text);
          } catch {
            json = null;
          }

          if (!response.ok) {
            els.requestStatus.textContent = '请求失败';
            els.requestStatus.classList.add('danger');
            els.responseMeta.textContent = `HTTP ${response.status} · ${elapsed}ms`;
            els.responseMeta.classList.add('danger');
            els.resultBox.textContent = text;
            return;
          }

          const content = json?.choices?.[0]?.message?.content ?? text;
          els.requestStatus.textContent = '请求完成';
          els.responseMeta.textContent = `HTTP ${response.status} · ${elapsed}ms · ${content.length} chars`;
          els.resultBox.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
        } catch (error) {
          els.requestStatus.textContent = '请求异常';
          els.requestStatus.classList.add('danger');
          els.responseMeta.textContent = error?.message || String(error);
          els.responseMeta.classList.add('danger');
          els.resultBox.textContent = String(error?.stack || error);
        } finally {
          setBusy(false);
        }
      }

      const state = loadState();
      if (state) {
        els.apiKey.value = state.apiKey || '';
        els.promptMode.value = state.promptMode || 'dom-plan';
        els.model.value = state.model || 'deepseek-chat';
        els.temperature.value = state.temperature || '0.2';
        els.systemPrompt.value = state.systemPrompt || DOM_PLAN_SYSTEM_PROMPT;
        els.selectionText.value = state.selectionText || '';
        els.requirementText.value = state.requirementText || '';
        els.extraContext.value = state.extraContext || '';
        updateUserPrompt();
      } else {
        setDefaultPrompt();
        updateUserPrompt();
      }

      [
        els.apiKey,
        els.promptMode,
        els.model,
        els.temperature,
        els.systemPrompt
      ].forEach((el) => {
        el.addEventListener('input', () => {
          updateUserPrompt();
          saveState();
        });
        el.addEventListener('change', () => {
          updateUserPrompt();
          saveState();
        });
      });

      [
        els.selectionText,
        els.requirementText,
        els.extraContext
      ].forEach((el) => {
        el.addEventListener('input', () => {
          updateUserPrompt();
          saveState();
        });
      });

      els.copyPromptBtn.addEventListener('click', () => copyText(els.userPrompt.value));
      els.planPresetBtn.addEventListener('click', () => {
        els.promptMode.value = 'dom-plan';
        els.systemPrompt.value = DOM_PLAN_SYSTEM_PROMPT;
        if (!els.requirementText.value.trim()) {
          els.requirementText.value = '根据当前 DOM 输出下一步本地源码检索 Plan';
        }
        updateUserPrompt();
        saveState();
        els.requestStatus.textContent = '已切换 DOM Plan 提示词';
        els.requestStatus.classList.remove('danger');
      });
      els.copyResultBtn.addEventListener('click', () => copyText(els.resultBox.textContent));
      els.clearResultBtn.addEventListener('click', () => {
        els.resultBox.textContent = '';
        els.responseMeta.textContent = '等待响应';
        els.requestStatus.textContent = '结果已清空';
        els.requestStatus.classList.remove('danger');
      });
      els.resetBtn.addEventListener('click', () => {
        setDefaultPrompt();
        updateUserPrompt();
        saveState();
        els.requestStatus.textContent = '已恢复默认提示词';
        els.requestStatus.classList.remove('danger');
      });
      els.sendBtn.addEventListener('click', sendRequest);
    </script>
  </body>
</html>
