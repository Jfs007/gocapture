<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnus Side Panel</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #6b7280;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        pointer-events: none;
      }

      .rebind {
        position: absolute;
        top: 10px;
        right: 46px;
        z-index: 2;
        width: 28px;
        height: 28px;
        border: 1px solid #d8dee6;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.9);
        color: #4b5563;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="magnus-sidepanel-rebind" class="rebind" type="button" title="重新绑定当前页面">↻</button>
    <div id="magnus-sidepanel-status" class="status">连接 Magnus 本地服务...</div>
    <iframe id="magnus-sidepanel-frame" title="Magnus"></iframe>
    <script src="js/sidepanel.js"></script>
  </body>
</html>
