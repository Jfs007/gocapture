<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>弹出窗口</title>
</head>
<style>
  html {
    /* border-radius: 12px; */
    --primary-color: #3777FF;
    --primary-color2: rgba(55, 119, 255, 0.3);
  }

  body {
    width: 300px;
    font-family: PingFangSC-Regular, PingFang SC;
    margin: 0;
    padding: 0px;
    /* border-radius: 12px; */
    box-sizing: content-box;
    background-color: rgba(0, 0, 0, 0);
    overflow: hidden;

  }


  .container {

    border-bottom: 1px solid #ccc;
    position: relative;
    box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.02);
    /* border-radius: 12px; */
    background: var(--primary-color2);

    position: relative;
  }

  .container .header {
    width: 100%;
    padding: 10px 0;
    color: #323335;
  }

  .container .header p {
    font-size: 14px;
    font-weight: 500;

    margin: 0;
    padding: 0;
    text-align: center;
  }


  .container .body {
    background-color: #fff;
    width: 100%;
    padding: 0 10px;
    box-sizing: border-box;
    padding-bottom: 6px;
    /* border-radius: 12px 12px 0 0; */
  }

  .tips p {
    font-size: 14px;
    color: #969aa0;
    line-height: 25px;
    margin: 0;
  }

  .tips .update {
    /* color: #207efb; */
    font-size: 12px;
    font-weight: 400;
    padding: 10px 0;
    color: var(--primary-color);
    text-align: right;
  }

  button {
    margin: 0 8px;
    line-height: 32px;
    min-width: 140px;
    color: #fff;
    outline: none;
    border-color: transparent;
  }

  button.button--small {
    line-height: 24px;
    min-width: 70px
  }

  button.button--default {
    background-color: var(--primary-color);
  }

  button.button--primary {
    background-color: #23c23f;
  }


  .btn button {
    background-color: var(--primary-color);
  }

  .msg {
    display: none;
    text-align: center;
  }

  .blue {
    color: var(--primary-color) !important;
  }

  .green {
    color: #23c23f !important;
  }

  .red {
    color: #fb2025 !important;
  }

  .btn-group {
    padding: 10px 0;
    text-align: center;
  }

  .btn .btn {
    margin-top: 10px;
    /* margin: 20px 0 10px 0; */
  }

  .options-list {
    cursor: pointer;
    text-align: right;
    color: #000;
    font-size: 10px;
    opacity: 0.6;

  }

  #copy-success,
  #getAuthCode {
    display: none;
  }

  #copyCode {
    cursor: pointer;
  }
</style>
<script type="application/javascript" src="../other/jquery.min.js"></script>
<script type="application/javascript" src="../chrome/cli.js"></script>
<script type="application/javascript" src="../cp_modules/store/index.js"></script>

<body>
  <div id="app"></div>
  <div class="container">
    <div class="header">
      <p>授权插件(v1.4)</p>
      <!-- <span>更新时间：2025-01-01</span> -->
    </div>
    <div class="body">

      <div class="tips">
        <p class="update">
          <!-- <a href="" target="_blank" id="appUpdateLink">更新插件>></a> -->
        </p>
        <!-- <p>· 同代理ID同快手ID仅需授权一次</p> -->
        <p>· 同意授权前，请确认平台保持在登录状态</p>
        <p class="red" id="errorText">当前授权的广告主账户可能不在您登录的巨量引擎账号下，请使用已授权的组织账号登录</p>
      </div>
      <div class="btn-group">

        <div class="btn">
          <button id="getCookie">同意授权</button>
        </div>

        <div id="authConfirm">
          <button class="button--small button--default" id="changeAccount">切换账号</button>
          <button class="button--small button--primary" id="authAccount">仍要授权</button>
        </div>

      </div>
      <div id="msg" class="msg green" style="margin-bottom: 10px;"></div>
      <!-- <div class="options-list" id="plugin-options">扩展选项</div> -->

    </div>

  </div>
</body>
<script type="application/javascript" src="./popup.js"></script>

</html>
